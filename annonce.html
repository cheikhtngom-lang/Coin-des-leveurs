<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails de l'annonce - Coin des Éleveurs</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            green: '#1E8E3E',
                            light: '#4ade80',
                            dark: '#14532d',
                        },
                        gold: '#FBBF24',
                        surface: '#f8fafc',
                    }
                }
            }
        }
    </script>
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="db.js"></script>
</head>
<body class="font-sans bg-surface text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Topbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="window.history.back()" class="w-10 h-10 bg-gray-50 hover:bg-gray-100 flex items-center justify-center rounded-full text-gray-600 transition-colors">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                    <div class="w-8 h-8 rounded-lg bg-brand-green flex items-center justify-center">
                        <i data-lucide="leaf" class="text-white w-5 h-5"></i>
                    </div>
                    <span class="font-bold text-xl text-gray-900 hidden sm:block">Coin des <span class="text-brand-green">Éleveurs</span></span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button class="w-10 h-10 bg-gray-50 hover:bg-gray-100 flex items-center justify-center rounded-full text-red-500 transition-colors shadow-sm">
                    <i data-lucide="heart" class="w-5 h-5"></i>
                </button>
                <button class="w-10 h-10 bg-gray-50 hover:bg-gray-100 flex items-center justify-center rounded-full text-gray-600 transition-colors shadow-sm">
                    <i data-lucide="share-2" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" id="annonce-container">
            <div class="text-center py-20 text-gray-500">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-4 text-brand-green"></i>
                Chargement de l'annonce...
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const animalId = urlParams.get('id');
            const container = document.getElementById('annonce-container');

            if (!animalId) {
                container.innerHTML = `<div class="text-center py-20 text-red-500 font-bold text-xl">Erreur : Aucun animal spécifié.</div>`;
                return;
            }

            const animal = await window.DB.getAnimalById(animalId);
            
            if (!animal) {
                container.innerHTML = `<div class="text-center py-20 text-red-500 font-bold text-xl">Erreur : Cette annonce n'existe plus.</div>`;
                return;
            }

            const users = await window.DB.get('users');
            const owner = users.find(u => u.id === animal.eleveurId) || { farmName: 'Éleveur inconnu', name: 'Inconnu' };
            const ownerName = owner.farmName || owner.name;

            const isAvailable = animal.status === 'disponible';

            let vaccinesHtml = '';
            if (animal.vaccines && animal.vaccines.length > 0) {
                vaccinesHtml = `
                    <div class="bg-blue-50 rounded-2xl p-6 border border-blue-100 mb-8">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center">
                                <i data-lucide="shield-check" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-blue-900">Carnet de Vaccination</h3>
                                <p class="text-sm text-blue-700">${animal.vaccines.length} vaccin(s) enregistré(s)</p>
                            </div>
                        </div>
                        <ul class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-blue-800">
                            ${animal.vaccines.map(v => `<li class="flex items-center gap-2"><i data-lucide="check" class="w-4 h-4 text-blue-500 shrink-0"></i> ${v}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            container.innerHTML = `
                <!-- Title & Meta (Mobile) -->
                <div class="mb-6 block lg:hidden">
                    <div class="flex items-center gap-2 mb-3 text-xs">
                        <span class="bg-brand-green/10 text-brand-green font-bold px-3 py-1 rounded-full uppercase tracking-wider">${animal.category}</span>
                        ${animal.isFeatured ? `<span class="bg-gold/10 text-gold font-bold px-3 py-1 rounded-full flex items-center gap-1 uppercase"><i data-lucide="star" class="w-3 h-3 fill-current"></i> À la une</span>` : ''}
                    </div>
                    <h1 class="text-3xl font-extrabold text-gray-900 mb-2">${animal.title}</h1>
                    <p class="text-2xl font-black text-brand-green">${Number(animal.price).toLocaleString()} FCFA</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                    
                    <!-- Left: Images -->
                    <div class="lg:col-span-7 space-y-4">
                        <div class="bg-gray-100 rounded-3xl overflow-hidden h-[400px] md:h-[500px] relative shadow-sm">
                            <img src="${animal.image || 'https://images.unsplash.com/photo-1511117833895-4b473c0b85d6?auto=format&fit=crop&w=800&q=80'}" alt="${animal.title}" class="w-full h-full object-cover">
                            ${!isAvailable ? `
                                <div class="absolute inset-0 bg-white/40 backdrop-blur-[2px] z-10 flex items-center justify-center">
                                    <div class="bg-red-500 text-white font-bold px-8 py-3 rounded-full transform -rotate-12 shadow-2xl text-xl">
                                        VENDU
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                        
                        <!-- Miniatures (Simulation) -->
                        <div class="flex gap-4 overflow-x-auto hide-scrollbar pb-2">
                            <button class="w-24 h-24 rounded-2xl overflow-hidden border-2 border-brand-green shrink-0 shadow-sm opacity-100">
                                <img src="${animal.image || 'https://images.unsplash.com/photo-1511117833895-4b473c0b85d6?auto=format&fit=crop&w=800&q=80'}" class="w-full h-full object-cover">
                            </button>
                            <!-- Fake thumbnails for mockup -->
                            <button class="w-24 h-24 rounded-2xl overflow-hidden border-2 border-transparent shrink-0 opacity-60 hover:opacity-100 transition-opacity">
                                <img src="${animal.image || 'https://images.unsplash.com/photo-1511117833895-4b473c0b85d6?auto=format&fit=crop&w=800&q=80'}" class="w-full h-full object-cover grayscale">
                            </button>
                        </div>
                    </div>

                    <!-- Right: Info -->
                    <div class="lg:col-span-5 flex flex-col">
                        
                        <!-- Title & Meta (Desktop) -->
                        <div class="hidden lg:block mb-8 pb-8 border-b border-gray-100">
                            <div class="flex items-center gap-2 mb-4 text-xs">
                                <span class="bg-brand-green/10 text-brand-green font-bold px-3 py-1 rounded-full uppercase tracking-wider">${animal.category}</span>
                                ${animal.isFeatured ? `<span class="bg-gold/10 text-gold font-bold px-3 py-1 rounded-full flex items-center gap-1 uppercase"><i data-lucide="star" class="w-3 h-3 fill-current"></i> À la une</span>` : ''}
                            </div>
                            <h1 class="text-4xl font-extrabold text-gray-900 mb-3">${animal.title}</h1>
                            <p class="text-3xl font-black text-brand-green">${Number(animal.price).toLocaleString()} <span class="text-lg text-gray-500 font-medium">FCFA</span></p>
                        </div>

                        <!-- Specs Grid -->
                        <div class="grid grid-cols-2 gap-4 mb-8">
                            <div class="bg-white border border-gray-100 rounded-2xl p-4 flex items-center gap-3 shadow-sm">
                                <div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-500"><i data-lucide="paw-print" class="w-5 h-5"></i></div>
                                <div>
                                    <p class="text-xs text-gray-400 font-bold uppercase">Race</p>
                                    <p class="font-semibold text-gray-900">${animal.race}</p>
                                </div>
                            </div>
                            <div class="bg-white border border-gray-100 rounded-2xl p-4 flex items-center gap-3 shadow-sm">
                                <div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-500"><i data-lucide="ruler" class="w-5 h-5"></i></div>
                                <div>
                                    <p class="text-xs text-gray-400 font-bold uppercase">Poids</p>
                                    <p class="font-semibold text-gray-900">${animal.weight ? animal.weight + ' kg' : 'Non précisé'}</p>
                                </div>
                            </div>
                            <div class="bg-white border border-gray-100 rounded-2xl p-4 flex items-center gap-3 shadow-sm">
                                <div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-500"><i data-lucide="calendar" class="w-5 h-5"></i></div>
                                <div>
                                    <p class="text-xs text-gray-400 font-bold uppercase">Âge</p>
                                    <p class="font-semibold text-gray-900">${animal.age || 'Non précisé'}</p>
                                </div>
                            </div>
                            <div class="bg-white border border-gray-100 rounded-2xl p-4 flex items-center gap-3 shadow-sm">
                                <div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-500"><i data-lucide="map-pin" class="w-5 h-5"></i></div>
                                <div>
                                    <p class="text-xs text-gray-400 font-bold uppercase">Localisation</p>
                                    <p class="font-semibold text-gray-900 truncate" title="${animal.location}">${animal.location}</p>
                                </div>
                            </div>
                        </div>

                        ${vaccinesHtml}

                        <!-- Breeder Info -->
                        <div class="bg-gray-900 rounded-3xl p-6 text-white mb-8 flex flex-col sm:flex-row items-center gap-6 shadow-xl shadow-gray-900/20">
                            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(ownerName)}&background=1E8E3E&color=fff" class="w-20 h-20 rounded-full border-4 border-gray-700">
                            <div class="text-center sm:text-left flex-1">
                                <h3 class="text-xl font-bold mb-1">${ownerName}</h3>
                                <div class="flex items-center justify-center sm:justify-start gap-2 text-sm text-gray-400 mb-3">
                                    <i data-lucide="shield-check" class="w-4 h-4 text-brand-light"></i>
                                    <span>Éleveur vérifié</span>
                                    <span class="w-1 h-1 rounded-full bg-gray-600"></span>
                                    <span class="flex items-center text-gold"><i data-lucide="star" class="w-3 h-3 fill-current mr-1"></i> 4.9</span>
                                </div>
                                <button class="text-sm font-semibold text-brand-light hover:text-white transition-colors">Voir le profil complet &rarr;</button>
                            </div>
                        </div>

                        <!-- CTA Actions -->
                        <div class="mt-auto space-y-3">
                            <button ${!isAvailable ? 'disabled' : ''} onclick="alert('Module de paiement Wave/Orange Money en cours d\\'intégration !')" class="w-full bg-brand-green hover:bg-brand-dark text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-brand-green/30 hover:-translate-y-1 transition-all flex items-center justify-center gap-2 ${!isAvailable ? 'opacity-50 cursor-not-allowed hover:translate-y-0' : ''}">
                                <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                                ${isAvailable ? 'Acheter maintenant' : 'Vendu'}
                            </button>
                            <button class="w-full bg-white hover:bg-gray-50 text-gray-900 border-2 border-gray-200 py-4 rounded-2xl font-bold text-lg transition-all flex items-center justify-center gap-2">
                                <i data-lucide="message-circle" class="w-6 h-6"></i>
                                Contacter l'éleveur
                            </button>
                        </div>

                    </div>
                </div>
            `;
            lucide.createIcons();
        });
    </script>
</body>
</html>
