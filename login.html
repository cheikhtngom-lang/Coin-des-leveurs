<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Coin des Éleveurs</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { green: '#1E8E3E', light: '#4ade80', dark: '#14532d' },
                        gold: '#FBBF24',
                        surface: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="db.js"></script>
</head>
<body class="font-sans bg-surface text-gray-800 antialiased min-h-screen flex items-center justify-center py-8 px-4 sm:px-6 lg:px-8 relative overflow-x-hidden overflow-y-auto">
    
    <!-- Bouton Retour -->
    <a href="index.html" class="absolute top-6 left-6 z-20 flex items-center gap-2 bg-white/80 backdrop-blur-md px-4 py-2 rounded-full font-bold text-gray-700 hover:text-brand-green hover:scale-105 active:scale-95 transition-all duration-300 shadow-sm border border-white/50">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Retour au site
    </a>

    <!-- Background Design -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1544243689-53e7f918e690?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80" alt="Background" class="w-full h-full object-cover opacity-[0.03]">
        <div class="absolute top-0 right-0 w-96 h-96 bg-brand-green/10 rounded-full blur-3xl -mt-20 -mr-20"></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-gold/10 rounded-full blur-3xl -mb-20 -ml-20"></div>
    </div>

    <div class="max-w-md w-full space-y-8 bg-white/80 backdrop-blur-xl p-8 rounded-3xl shadow-xl border border-white/50 relative z-10">
        <div>
            <div class="flex items-center justify-center gap-2 cursor-pointer mb-6" onclick="window.location.href='index.html'">
                <div class="w-12 h-12 rounded-2xl bg-brand-green flex items-center justify-center shadow-lg shadow-brand-green/30">
                    <i data-lucide="leaf" class="text-white w-7 h-7"></i>
                </div>
            </div>
            <h2 class="text-center text-3xl font-extrabold text-gray-900">Bon retour !</h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Connectez-vous à votre espace personnel.
            </p>
        </div>
        
        <!-- Toggle User Type -->
        <div class="flex p-1 bg-gray-100 rounded-xl">
            <button class="flex-1 py-2 text-sm font-bold rounded-lg bg-white text-gray-900 shadow-sm transition-all" id="btn-eleveur">Éleveur</button>
            <button class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-900 transition-all" id="btn-user">Utilisateur</button>
        </div>

        <form class="mt-6 space-y-5" action="#" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="email-address" class="block text-sm font-semibold text-gray-700 mb-1">Adresse Email ou Téléphone</label>
                    <input id="email-address" name="email" type="text" autocomplete="email" required class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-brand-green focus:border-brand-green focus:z-10 sm:text-sm transition-colors" placeholder="nom@exemple.com ou adminshewu">
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <label for="password" class="block text-sm font-semibold text-gray-700">Mot de passe</label>
                        <a href="#" class="text-sm font-medium text-brand-green hover:text-brand-dark">Mot de passe oublié ?</a>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password" required class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-brand-green focus:border-brand-green focus:z-10 sm:text-sm transition-colors" placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-brand-green focus:ring-brand-green border-gray-300 rounded cursor-pointer">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-900 cursor-pointer">
                        Se souvenir de moi
                    </label>
                </div>
            </div>

            <div>
                <button type="button" id="submit-btn" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-brand-green hover:bg-brand-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-green transition-all duration-300 shadow-lg shadow-brand-green/30 hover:scale-105 active:scale-95">
                    Se connecter
                </button>
            </div>
        </form>
        
        <div class="mt-4 text-center">
            <p class="text-sm text-gray-600">
                Pas encore de compte ? 
                <a href="register.html" class="font-bold text-brand-green hover:text-brand-dark">Créer un compte</a>
            </p>
        </div>
    </div>
    <script>
        lucide.createIcons();
        
        // Simple toggle visual logic
        const btnEleveur = document.getElementById('btn-eleveur');
        const btnUser = document.getElementById('btn-user');
        const submitBtn = document.getElementById('submit-btn');
        let currentUserType = 'eleveur';
        
        btnEleveur.addEventListener('click', () => {
            currentUserType = 'eleveur';
            btnEleveur.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white text-gray-900 shadow-sm transition-all";
            btnUser.className = "flex-1 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-900 transition-all";
        });
        
        btnUser.addEventListener('click', () => {
            currentUserType = 'user';
            btnUser.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white text-gray-900 shadow-sm transition-all";
            btnEleveur.className = "flex-1 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-900 transition-all";
        });

        submitBtn.addEventListener('click', async () => {
            const email = document.getElementById('email-address').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Veuillez remplir tous les champs');
                return;
            }

            const oldText = submitBtn.innerText;
            submitBtn.innerText = "Connexion...";
            submitBtn.disabled = true;

            try {
                const result = await window.DB.login(email, password, currentUserType);
                
                if (result.success) {
                    if (result.user.role === 'admin') {
                        window.location.href = 'dashboard-admin.html';
                    } else if (result.user.role === 'eleveur') {
                        window.location.href = 'dashboard-eleveur.html';
                    } else {
                        window.location.href = 'dashboard-user.html';
                    }
                } else {
                    alert(result.message);
                    submitBtn.innerText = oldText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error("Erreur critique:", error);
                alert("Une erreur inattendue s'est produite. Vérifiez que vous lancez bien le site via Live Server (127.0.0.1).");
                submitBtn.innerText = oldText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
