<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Interactive - Coin des Éleveurs</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { green: '#1E8E3E', light: '#4ade80', dark: '#14532d' },
                        gold: '#FBBF24',
                        surface: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Leaflet CSS for Map Mockup -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map { height: calc(100vh - 80px); width: 100%; z-index: 10; }
        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 16px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .custom-popup .leaflet-popup-content { margin: 0; width: 280px !important; }
    </style>
</head>
<body class="font-sans bg-surface text-gray-800 antialiased h-screen overflow-hidden flex flex-col">

    <!-- Navigation -->
    <nav class="w-full bg-white border-b border-gray-200 z-50 shrink-0 h-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full">
            <div class="flex justify-between items-center h-full">
                <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                    <div class="w-10 h-10 rounded-xl bg-brand-green flex items-center justify-center">
                        <i data-lucide="leaf" class="text-white w-6 h-6"></i>
                    </div>
                    <span class="font-bold text-2xl tracking-tight text-gray-900 hidden sm:block">Coin des <span class="text-brand-green">Éleveurs</span></span>
                </div>
                
                <div class="flex items-center bg-gray-50 rounded-xl px-2 py-1 shadow-inner">
                    <button class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-white shadow-sm text-gray-900">Carte</button>
                    <button class="px-4 py-1.5 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900" onclick="window.location.href='recherche.html'">Liste</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Map Container -->
    <div class="flex-1 relative w-full">
        <div id="map"></div>
        
        <!-- Search overlay on map -->
        <div class="absolute top-6 left-6 z-[1000] bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-white/50 w-80 max-w-[calc(100vw-48px)]">
            <h3 class="font-bold text-gray-900 mb-3 flex items-center gap-2">
                <i data-lucide="map" class="w-5 h-5 text-brand-green"></i> 
                Rechercher un éleveur
            </h3>
            <div class="space-y-3">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-3"></i>
                    <input type="text" placeholder="Nom, région..." class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-9 pr-4 py-2 text-sm focus:ring-brand-green focus:border-brand-green">
                </div>
                <select class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-brand-green focus:border-brand-green">
                    <option>Toutes espèces</option>
                    <option>Bovins</option>
                    <option>Ovins</option>
                </select>
                <button class="w-full bg-brand-green hover:bg-brand-dark text-white font-bold py-2 rounded-xl transition-all duration-300 text-sm shadow-md shadow-brand-green/30 hover:scale-105 active:scale-95">
                    Trouver
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Initialize map centered on Senegal
        const map = L.map('map', {
            zoomControl: false // Disable default to move it
        }).setView([14.4974, -14.4524], 7);

        // Add custom tile layer (CartoDB Positron for modern clean look)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Move zoom control to bottom right
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Custom Icon for Breeders
        const breederIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `
                <div style="background-color: #1E8E3E; width: 40px; height: 40px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                <div style="width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid #1E8E3E; margin: -2px auto 0;"></div>
            `,
            iconSize: [40, 50],
            iconAnchor: [20, 50],
            popupAnchor: [0, -50]
        });

        // Mock Data for Senegal Breeders
        const breeders = [
            {
                name: "Ferme Sokhna",
                lat: 14.7928, lng: -16.9248, // Thiès
                image: "https://images.unsplash.com/photo-1500595046743-cd271d694d30?w=300",
                verified: true,
                animals: 45,
                specialty: "Ovins Ladoum",
                phone: "+221 77 123 45 67"
            },
            {
                name: "Élevage Diop",
                lat: 15.6175, lng: -16.2238, // Louga
                image: "https://images.unsplash.com/photo-1596733430284-f7437764b1a9?w=300",
                verified: true,
                animals: 120,
                specialty: "Bovins Gobra",
                phone: "+221 77 987 65 43"
            },
            {
                name: "Haras de Dakar",
                lat: 14.7167, lng: -17.4677, // Dakar
                image: "https://images.unsplash.com/photo-1553531384-cc64ac80f931?w=300",
                verified: false,
                animals: 12,
                specialty: "Chevaux de course",
                phone: "+221 76 555 44 33"
            }
        ];

        // Add markers
        breeders.forEach(breeder => {
            const popupContent = `
                <div class="relative">
                    <img src="${breeder.image}" alt="${breeder.name}" class="w-full h-32 object-cover">
                    ${breeder.verified ? `<div class="absolute top-2 right-2 bg-white/90 px-2 py-0.5 rounded-full text-[10px] font-bold text-gray-900 flex items-center gap-1"><svg class="w-3 h-3 text-[#1E8E3E]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> Vérifié</div>` : ''}
                </div>
                <div class="p-4 bg-white">
                    <h4 class="font-bold text-lg text-gray-900 mb-1">${breeder.name}</h4>
                    <p class="text-xs text-brand-green font-bold mb-3 uppercase tracking-wider">${breeder.specialty}</p>
                    
                    <div class="grid grid-cols-2 gap-2 mb-4 text-sm text-gray-600">
                        <div class="flex items-center gap-1"><svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${breeder.animals} animaux</div>
                        <div class="flex items-center gap-1"><svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg> Contact</div>
                    </div>
                    
                    <button class="w-full bg-gray-900 hover:bg-brand-green text-white font-bold py-2 rounded-xl transition-all duration-300 text-sm hover:scale-105 active:scale-95">
                        Voir la boutique
                    </button>
                </div>
            `;

            L.marker([breeder.lat, breeder.lng], { icon: breederIcon })
             .addTo(map)
             .bindPopup(popupContent, {
                 className: 'custom-popup'
             });
        });
    </script>
</body>
</html>
